name: evimesh

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evimesh_dev
      POSTGRES_USER: evimesh
      POSTGRES_PASSWORD: evimesh_local_only
    ports:
      - "${EVIMESH_POSTGRES_PORT:-5432}:5432"
    volumes:
      - evimesh_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evimesh -d evimesh_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: evimesh_minio
      MINIO_ROOT_PASSWORD: evimesh_minio_local_only
    command: server /data --console-address ":9001"
    ports:
      - "${EVIMESH_S3_PORT:-9000}:9000"
      - "${EVIMESH_S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - evimesh_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  evimesh_postgres_data:
  evimesh_minio_data:
