name: Web Production

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "docs/product/**"
      - ".github/workflows/web-production.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.17.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate docs content module
        run: pnpm docs:content
      - name: Deploy Cloudflare Workers production
        run: pnpm --filter @evimesh/web deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_EVIMESH_API_URL: https://api.evimesh.com
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_ORCID_PROVIDER: "custom:orcid"
