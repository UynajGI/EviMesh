name: Recommender Training

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/recommender-training/requirements.txt
      - name: Install trainer dependencies
        run: pip install -r packages/recommender-training/requirements.txt
      - name: Train item-item collaborative filtering
        run: python packages/recommender-training/train.py
        env:
          EVIMESH_DATABASE_URL: ${{ secrets.EVIMESH_PRODUCTION_DATABASE_URL }}
