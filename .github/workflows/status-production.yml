name: Status Production

on:
  push:
    branches: [main]
    paths:
      - "apps/status/**"
      - ".github/workflows/status-production.yml"

permissions:
  contents: read

concurrency:
  group: status-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://status.evimesh.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test status Worker
        run: pnpm --filter @evimesh/status test
      - name: Deploy status Worker
        run: pnpm --filter @evimesh/status deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
