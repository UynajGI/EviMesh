name: Web Preview

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-preview.yml"

permissions:
  contents: read

jobs:
  preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Cloudflare preview credentials
        id: cloudflare_credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && curl --fail --silent --show-error --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify >/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare preview deployment skipped because the required credentials are absent or the API token is invalid. The production build still ran."
          fi
      - name: Deploy Cloudflare Workers preview
        if: steps.cloudflare_credentials.outputs.available == 'true'
        run: pnpm --filter @evimesh/web deploy:preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_EVIMESH_API_URL: https://api.evimesh.com
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Report skipped Cloudflare preview deployment
        if: steps.cloudflare_credentials.outputs.available != 'true'
        run: echo "Cloudflare preview deployment was skipped; configure repository secrets before relying on preview URLs."
